<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecureTransfer — Secure File Transfer</title>
<style>
:root{--bg:#f4f7fb;--surface:#fff;--surface2:#f8fafc;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb;--primary2:#1d4ed8;--accent:#06b6d4;--success:#059669;--danger:#dc2626;--sidebar:#0b1220;--sidebar-hover:#172033;--shadow:0 12px 35px rgba(15,23,42,.08);--radius:18px}body.dark{--bg:#070b14;--surface:#0f172a;--surface2:#111c2d;--text:#e5e7eb;--muted:#94a3b8;--line:#263449;--shadow:0 16px 45px rgba(0,0,0,.28)}*{box-sizing:border-box}html{font-size:16px}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--bg);line-height:1.5}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.app{min-height:100vh}
.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(16px);position:sticky;top:0;z-index:30}body.dark .topbar,body.dark .header{background:rgba(15,23,42,.92)}
.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px;letter-spacing:-.3px}.brand-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;display:grid;place-items:center;box-shadow:0 7px 18px rgba(37,99,235,.25)}.nav-actions{display:flex;gap:10px}.btn{border:0;border-radius:11px;padding:12px 17px;font-weight:750;transition:transform .15s,box-shadow .15s,background .15s}.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}.btn-primary{background:linear-gradient(135deg,var(--primary),#3b82f6);color:#fff;box-shadow:0 7px 18px rgba(37,99,235,.2)}.btn-primary:hover{background:linear-gradient(135deg,var(--primary2),var(--primary))}.btn-secondary,.theme-btn{background:var(--surface);border:1px solid var(--line);color:var(--text)}.btn-danger{background:#fee2e2;color:#991b1b}.btn-success{background:#dcfce7;color:#166534}body.dark .btn-danger{background:#3a171c;color:#fecaca}body.dark .btn-success{background:#103125;color:#a7f3d0}
.landing{min-height:100vh;background:radial-gradient(circle at 15% 15%,rgba(37,99,235,.13),transparent 30%),radial-gradient(circle at 85% 20%,rgba(6,182,212,.12),transparent 28%),linear-gradient(135deg,#f8fbff,#f8fafc 55%,#f0fdf9)}body.dark .landing{background:radial-gradient(circle at 15% 15%,rgba(37,99,235,.18),transparent 30%),radial-gradient(circle at 85% 20%,rgba(6,182,212,.12),transparent 28%),#070b14}.hero{max-width:1180px;margin:auto;padding:92px 24px 68px;text-align:center}.badge{display:inline-flex;gap:7px;align-items:center;padding:8px 13px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:13px;font-weight:800}.hero h1{font-size:clamp(42px,6vw,72px);line-height:1.02;margin:22px 0 20px;letter-spacing:-2.8px}.hero p{max-width:780px;margin:auto;color:var(--muted);font-size:18px;line-height:1.75}.hero-actions{margin-top:32px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.features{max-width:1180px;margin:auto;padding:28px 24px 90px;display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.feature,.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.feature{padding:24px}.feature-icon{font-size:25px}.feature h3{margin:13px 0 7px;font-size:17px}.feature p{color:var(--muted);line-height:1.6;font-size:14px}
.auth-page{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at 20% 20%,rgba(37,99,235,.12),transparent 35%),linear-gradient(135deg,#f8fbff,#f1f5f9)}body.dark .auth-page{background:#070b14}.auth-card{width:min(460px,100%);padding:34px}.auth-card h1{margin:0 0 7px;font-size:30px;letter-spacing:-.7px}.sub{color:var(--muted);margin:0 0 25px}.form-group{margin:17px 0}.form-group label{display:block;font-weight:750;font-size:14px;margin-bottom:8px}.input{width:100%;padding:13px 14px;border:1px solid #d7dee9;border-radius:11px;outline:none;background:var(--surface);color:var(--text);transition:.15s}.input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px rgba(96,165,250,.15)}body.dark .input{border-color:#334155}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.password-wrap{position:relative}.password-wrap .toggle{position:absolute;right:8px;top:7px;padding:6px 8px;border:0;background:transparent;color:var(--muted)}.msg{padding:11px 13px;border-radius:10px;font-size:14px;margin:12px 0}.msg.error{background:#fee2e2;color:#991b1b}.msg.success{background:#dcfce7;color:#166534}.auth-footer{text-align:center;margin-top:19px;color:var(--muted);font-size:14px}.link{color:var(--primary);font-weight:750;cursor:pointer}.demo-box{margin-top:18px;padding:14px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;font-size:13px}body.dark .demo-box{background:#0b1d35;border-color:#244b7b}
.shell{display:flex;min-height:100vh}.sidebar{width:258px;background:var(--sidebar);color:#cbd5e1;position:fixed;inset:0 auto 0 0;padding:20px 15px;z-index:40;box-shadow:8px 0 30px rgba(2,6,23,.08)}.sidebar .brand{color:#fff;padding:5px 9px 27px}.nav{display:grid;gap:6px}.nav button{width:100%;border:0;background:transparent;color:#aebbd0;text-align:left;padding:12px 13px;border-radius:11px;font-weight:700}.nav button:hover,.nav button.active{background:var(--sidebar-hover);color:#fff}.logout{position:absolute;bottom:20px;left:15px;right:15px}.main{margin-left:258px;width:calc(100% - 258px);min-width:0}.header{height:76px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:20}.theme-btn{border-radius:10px;padding:9px 12px;font-weight:750}.mobile-menu{display:none;border:0;background:transparent;color:var(--text);font-size:24px}.user-chip{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#dbeafe;color:#1d4ed8;font-weight:850}.content{padding:32px;max-width:1500px;margin:auto}.page-title{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:24px}.page-title h1{margin:0;font-size:30px;letter-spacing:-.8px}.page-title p{margin:5px 0 0;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.stat{padding:22px}.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}.stat-value{font-size:32px;font-weight:850;margin-top:10px;letter-spacing:-1px}.grid2{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;margin-top:20px}.card{padding:22px}.card h2,.card h3{margin:0 0 16px}.security-list{display:grid;gap:11px}.security-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface2);border-radius:11px}.check{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#dcfce7;color:#15803d;font-size:13px;font-weight:900}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:14px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:14px}.table th{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}.status{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800;background:#dcfce7;color:#166534}.status.pending{background:#fef3c7;color:#92400e}.status.secure{background:#dbeafe;color:#1d4ed8}body.dark .status{background:#103125;color:#a7f3d0}body.dark .status.secure{background:#102b4d;color:#93c5fd}
.upload-zone{border:2px dashed #a9c7f5;border-radius:18px;padding:52px 20px;text-align:center;background:linear-gradient(180deg,#f5f9ff,#eff6ff);transition:.18s}.upload-zone.drag{border-color:var(--primary);background:#dbeafe;transform:scale(1.005)}body.dark .upload-zone{background:#0b1d35;border-color:#315b9a}.upload-zone input{display:none}.upload-icon{font-size:44px}.file-preview{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:16px;padding:16px;background:var(--surface2);border:1px solid var(--line);border-radius:13px}.file-info strong{display:block}.file-info span{color:var(--muted);font-size:13px}.progress{height:9px;background:#e5e7eb;border-radius:20px;overflow:hidden;margin-top:16px}.progress>div{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));width:0;transition:.2s}.actions{display:flex;gap:8px;flex-wrap:wrap}.security-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.security-card{padding:22px;border:1px solid var(--line);border-radius:15px;background:var(--surface2)}.security-card .big{font-size:30px}.security-card p{color:var(--muted);line-height:1.65}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.detail{padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:11px}.detail small{display:block;color:var(--muted);margin-bottom:4px}.hash{word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
.toast{position:fixed;right:22px;bottom:22px;z-index:100;padding:14px 17px;border-radius:12px;background:#111827;color:#fff;box-shadow:var(--shadow);max-width:390px;font-weight:650}.toast.success{background:#065f46}.toast.error{background:#991b1b}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);display:grid;place-items:center;z-index:80;padding:20px}.modal{width:min(500px,100%);background:var(--surface);border-radius:18px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
@media(max-width:1050px){.features{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.security-grid{grid-template-columns:1fr}}@media(max-width:720px){.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:translateX(0)}.main{margin-left:0;width:100%}.mobile-menu{display:block}.header{padding:0 16px}.content{padding:22px 16px}.stats{grid-template-columns:1fr 1fr}.features{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}.page-title{align-items:flex-start;flex-direction:column}.user-chip>div:last-child{display:none}}@media(max-width:430px){.stats{grid-template-columns:1fr}.hero{padding-top:60px}.auth-card{padding:24px}.nav-actions .btn-secondary{display:none}.hero h1{letter-spacing:-1.8px}}
</style>
</head>
<body>
<div id="root"></div>
<script>
const DB_KEY="secure_transfer_ui_db_v1", SESSION_KEY="secure_transfer_ui_session";
const DEMO1={id:"demo1",name:"Demo User 1",email:"demo1@example.com",password:"Demo@12345",createdAt:new Date().toISOString(),publicKey:"Demo public key • never a private key"};
const DEMO2={id:"demo2",name:"Demo User 2",email:"demo2@example.com",password:"Demo@12345",createdAt:new Date().toISOString(),publicKey:"Demo public key • never a private key"};
function loadDB(){let d=JSON.parse(localStorage.getItem(DB_KEY)||"null");if(!d){d={users:[DEMO1,DEMO2],files:[]};localStorage.setItem(DB_KEY,JSON.stringify(d))}return d}
function saveDB(d){localStorage.setItem(DB_KEY,JSON.stringify(d))}
const VAULT_DB="secure_transfer_vault_v2";
function vault(){return new Promise((resolve,reject)=>{const r=indexedDB.open(VAULT_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains("files"))r.result.createObjectStore("files")};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function vaultPut(id,data){const db=await vault();return new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").put(data,id);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function vaultGet(id){const db=await vault();return new Promise((resolve,reject)=>{const tx=db.transaction("files","readonly"),r=tx.objectStore("files").get(id);r.onsuccess=()=>{db.close();resolve(r.result)};r.onerror=()=>{db.close();reject(r.error)}})}
async function vaultDelete(id){try{const db=await vault();await new Promise((resolve,reject)=>{const tx=db.transaction("files","readwrite");tx.objectStore("files").delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}catch(e){}}
function session(){return localStorage.getItem(SESSION_KEY)}
function setSession(id){localStorage.setItem(SESSION_KEY,id)}
function clearSession(){localStorage.removeItem(SESSION_KEY)}
function user(){let d=loadDB();return d.users.find(x=>x.id===session())}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function fmt(n){if(!n)return"0 B";let u=["B","KB","MB","GB"],i=Math.floor(Math.log(n)/Math.log(1024));return (n/Math.pow(1024,i)).toFixed(i?1:0)+" "+u[i]}
function date(s){return new Date(s).toLocaleString()}
function toast(msg,type=""){let x=document.createElement("div");x.className="toast "+type;x.textContent=msg;document.body.appendChild(x);setTimeout(()=>x.remove(),2800)}
function applyTheme(){let d=localStorage.getItem("secure_transfer_theme")==="dark";document.body.classList.toggle("dark",d);let b1=document.getElementById("themeLanding"),b2=document.getElementById("themeApp");[b1,b2].forEach(b=>{if(b)b.textContent=d?"☀️ Light":"🌙 Dark"})}function toggleTheme(){let d=!document.body.classList.contains("dark");localStorage.setItem("secure_transfer_theme",d?"dark":"light");applyTheme()}function navigate(hash){location.hash=hash}
function sha256(buf){return crypto.subtle.digest("SHA-256",buf)}
async function encryptForDemo(file){const raw=await file.arrayBuffer();const hash=await sha256(raw);const key=await crypto.subtle.generateKey({name:"AES-GCM",length:256},true,["encrypt","decrypt"]);const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,raw);const jwk=await crypto.subtle.exportKey("jwk",key);return {cipher:new Uint8Array(cipher),iv:[...iv],key:jwk,hash:[...new Uint8Array(hash)],originalSize:file.size}}
async function decryptDemo(f){const key=await crypto.subtle.importKey("jwk",f.key,{name:"AES-GCM"},true,["decrypt"]);const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:new Uint8Array(f.iv)},key,from64(f.cipher));const hash=await sha256(plain);return {plain,verified:JSON.stringify([...new Uint8Array(hash)])===JSON.stringify(f.hash)}}
function base64(a){let s="";const b=new Uint8Array(a);for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode(...b.subarray(i,i+0x8000));return btoa(s)}
function from64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}

const root=document.getElementById("root");
function landing(){root.innerHTML=`<div class="landing"><div class="topbar"><div class="brand"><div class="brand-icon">🔐</div>SecureTransfer</div><div class="nav-actions"><button class="theme-btn" onclick="toggleTheme()" id="themeLanding">🌙 Dark</button><button class="btn btn-secondary" onclick="navigate('#/login')">Login</button><button class="btn btn-primary" onclick="navigate('#/register')">Register</button></div></div><section class="hero"><span class="badge">🛡️ Engineering Capstone • Secure File Transfer</span><h1>Secure File Transfer with End-to-End Encryption</h1><p>Transfer sensitive files through an authenticated, security-focused interface with real browser cryptography, integrity verification, recipient authorization and secure file workflows.</p><div class="hero-actions"><button class="btn btn-primary" onclick="navigate('#/login')">Open SecureTransfer</button><button class="btn btn-secondary" onclick="demoLogin()">Try Demo Account</button></div></section><section class="features"><div class="feature"><div class="feature-icon">🔒</div><h3>AES-256-GCM</h3><p>Files are encrypted using the browser Web Crypto API before this UI stores the transfer record.</p></div><div class="feature"><div class="feature-icon">👤</div><h3>Authentication</h3><p>Register, login and logout using the same application authentication flow.</p></div><div class="feature"><div class="feature-icon">🛡️</div><h3>Authorization</h3><p>Received and sent file views are scoped to the currently authenticated demo user.</p></div><div class="feature"><div class="feature-icon">✓</div><h3>SHA-256 Integrity</h3><p>The original file hash is calculated and verified after decryption.</p></div></section></div>`}
function auth(mode){root.innerHTML=`<div class="auth-page"><div class="card auth-card"><div class="brand" style="margin-bottom:22px"><div class="brand-icon">🔐</div>SecureTransfer</div><h1>${mode==="login"?"Welcome back":"Create your account"}</h1><p class="sub">${mode==="login"?"Sign in to your secure workspace.":"Register for secure file transfers."}</p><div id="authmsg"></div>${mode==="register"?`<div class="form-group"><label>Full Name</label><input id="name" class="input" placeholder="Your full name"></div>`:""}<div class="form-group"><label>Email</label><input id="email" class="input" type="email" placeholder="you@example.com"></div><div class="form-group"><label>Password</label><div class="password-wrap"><input id="password" class="input" type="password" placeholder="••••••••"><button class="toggle" onclick="togglePass()">Show</button></div></div>${mode==="register"?`<div class="form-group"><label>Confirm Password</label><input id="confirm" class="input" type="password" placeholder="••••••••"></div>`:""}<button class="btn btn-primary" style="width:100%;margin-top:5px" onclick="${mode==="login"?"doLogin()":"doRegister()"}">${mode==="login"?"Login":"Create Account"}</button>${mode==="login"?`<button class="btn btn-secondary" style="width:100%;margin-top:10px" onclick="demoLogin()">Try Demo User 1</button><div class="demo-box"><b>Demo credentials</b><br>demo1@example.com / Demo@12345<br><br><b>Second demo user</b><br>demo2@example.com / Demo@12345</div>`:""}<div class="auth-footer">${mode==="login"?"Don't have an account?":"Already have an account?"} <span class="link" onclick="navigate('#/${mode==="login"?"register":"login"}')">${mode==="login"?"Register":"Login"}</span> · <span class="link" onclick="navigate('#/')">Home</span></div></div></div>`}
function togglePass(){let x=document.getElementById("password");x.type=x.type==="password"?"text":"password"}
function doLogin(){let d=loadDB(),email=document.getElementById("email").value.trim().toLowerCase(),pw=document.getElementById("password").value;let u=d.users.find(x=>x.email.toLowerCase()===email);if(!u||u.password!==pw){document.getElementById("authmsg").innerHTML='<div class="msg error">Invalid email or password.</div>';return}setSession(u.id);navigate("#/dashboard")}
function demoLogin(){setSession("demo1");navigate("#/dashboard")}
function doRegister(){let d=loadDB(),name=document.getElementById("name").value.trim(),email=document.getElementById("email").value.trim().toLowerCase(),pw=document.getElementById("password").value,cf=document.getElementById("confirm").value;if(!name||!email||!pw){return msgAuth("All fields are required.","error")}if(pw.length<8){return msgAuth("Password must be at least 8 characters.","error")}if(pw!==cf){return msgAuth("Passwords do not match.","error")}if(d.users.some(x=>x.email.toLowerCase()===email)){return msgAuth("Email already exists.","error")}let u={id:crypto.randomUUID(),name,email,password:pw,createdAt:new Date().toISOString(),publicKey:"Generated application public-key placeholder"};d.users.push(u);saveDB(d);setSession(u.id);navigate("#/dashboard")}
function msgAuth(m,t){document.getElementById("authmsg").innerHTML=`<div class="msg ${t}">${esc(m)}</div>`}

function shell(page,content){let u=user();if(!u){navigate("#/login");return}let navs=[["dashboard","▦","Dashboard"],["upload","↑","Upload File"],["send","➤","Send Files"],["received","↓","Received Files"],["sent","↑","Sent Files"],["security","🛡","Security"],["profile","●","Profile"]];root.innerHTML=`<div class="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">🔐</div>SecureTransfer</div><div class="nav">${navs.map(n=>`<button class="${page===n[0]?"active":""}" onclick="navigate('#/${n[0]}')">${n[1]} &nbsp; ${n[2]}</button>`).join("")}</div><button class="btn btn-secondary logout" onclick="logout()">↪ Logout</button></aside><main class="main"><header class="header"><button class="mobile-menu" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button><div></div><div style="display:flex;align-items:center;gap:10px"><button class="theme-btn" onclick="toggleTheme()" id="themeApp">🌙 Dark</button><div class="user-chip"><div class="avatar">${esc(u.name[0]||"U").toUpperCase()}</div><div><b>${esc(u.name)}</b><div style="font-size:12px;color:var(--muted)">${esc(u.email)}</div></div></div></div></header><section class="content">${content}</section></main></div>`}
function logout(){clearSession();navigate("#/")}
function dashboard(){let d=loadDB(),u=user(),sent=d.files.filter(f=>f.senderId===u.id),received=d.files.filter(f=>f.recipientId===u.id),all=[...sent,...received],size=all.reduce((a,f)=>a+f.originalSize,0);let recent=[...all].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt)).slice(0,6);shell("dashboard",`<div class="page-title"><div><h1>Dashboard</h1><p>Welcome back, ${esc(u.name)}. Your secure transfer overview.</p></div><button class="btn btn-primary" onclick="navigate('#/upload')">🔒 Upload File</button></div><div class="stats"><div class="card stat"><div class="stat-top">Total Files <span>📁</span></div><div class="stat-value">${all.length}</div></div><div class="card stat"><div class="stat-top">Sent Files <span>↑</span></div><div class="stat-value">${sent.length}</div></div><div class="card stat"><div class="stat-top">Received Files <span>↓</span></div><div class="stat-value">${received.length}</div></div><div class="card stat"><div class="stat-top">Storage Used <span>💾</span></div><div class="stat-value">${fmt(size)}</div></div></div><div class="grid2"><div class="card"><h2>Recent Transfers</h2>${recent.length?`<div class="table-wrap"><table class="table"><thead><tr><th>File</th><th>Direction</th><th>Encryption</th><th>Status</th></tr></thead><tbody>${recent.map(f=>`<tr><td><b>${esc(f.name)}</b><br><small style="color:var(--muted)">${fmt(f.originalSize)}</small></td><td>${f.senderId===u.id?"Sent":"Received"}</td><td><span class="status secure">AES-256-GCM</span></td><td><span class="status secure">Delivered ✓</span></td></tr>`).join("")}</tbody></table></div>`:`<div style="color:var(--muted);padding:25px 0">No transfers yet. Upload a file to start.</div>`}</div><div class="card"><h2>Security Status</h2><div class="security-list"><div class="security-item"><span class="check">✓</span>Authenticated access</div><div class="security-item"><span class="check">✓</span>AES-256-GCM encryption</div><div class="security-item"><span class="check">✓</span>SHA-256 integrity</div><div class="security-item"><span class="check">✓</span>Recipient authorization</div></div></div></div>`)}
function uploadPage(){let d=loadDB(),u=user(),selected=null;let recipients=d.users.filter(x=>x.id!==u.id);shell("upload",`<div class="page-title"><div><h1>Upload File</h1><p>Encrypt a file and send it to a registered recipient.</p></div></div><div class="card"><div id="drop" class="upload-zone"><div class="upload-icon">☁️</div><h3>Drop your file here</h3><p style="color:var(--muted)">or click to browse • maximum 25 MB • stored in IndexedDB for reliable browser storage</p><label class="btn btn-primary">Choose File<input id="file" type="file" onchange="selectFile(this.files[0])"></label></div><div id="preview"></div><div class="form-group"><label>Recipient</label><select id="recipient" class="input"><option value="">Select registered user</option>${recipients.map(x=>`<option value="${x.id}">${esc(x.name)} — ${esc(x.email)}</option>`).join("")}</select></div><div class="form-group"><label>Optional message</label><textarea id="message" class="input" rows="3" placeholder="Add a secure transfer message"></textarea></div><div id="uploadprogress"></div><button id="sendbtn" class="btn btn-primary" onclick="sendSelectedFile()" disabled>🔒 Encrypt & Send</button></div>`);window._selectedFile=null;let dz=document.getElementById("drop");dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("drag")});dz.addEventListener("dragleave",()=>dz.classList.remove("drag"));dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("drag");selectFile(e.dataTransfer.files[0])})}
function selectFile(f){if(!f)return;if(f.size>25*1024*1024){toast("File is larger than 25 MB.","error");return}window._selectedFile=f;document.getElementById("preview").innerHTML=`<div class="file-preview"><div class="file-info"><strong>📄 ${esc(f.name)}</strong><span>${esc(f.type||"Unknown type")} • ${fmt(f.size)}</span></div><button class="btn btn-secondary" onclick="window._selectedFile=null;document.getElementById('preview').innerHTML='';document.getElementById('sendbtn').disabled=true">Remove</button></div>`;document.getElementById("sendbtn").disabled=false}
async function sendSelectedFile(){let f=window._selectedFile,recipient=document.getElementById("recipient").value;if(!f||!recipient){toast("Select a file and recipient.","error");return}if(recipient===user().id){toast("You cannot send a file to yourself.","error");return}let btn=document.getElementById("sendbtn"),p=document.getElementById("uploadprogress");btn.disabled=true;try{p.innerHTML=`<div class="msg">Encrypting locally with AES-256-GCM. Keep this tab open...</div><div class="progress"><div id="bar"></div></div>`;let bar=document.getElementById("bar");for(let i=10;i<=60;i+=10){await new Promise(r=>setTimeout(r,60));bar.style.width=i+"%"}let enc=await encryptForDemo(f),id=crypto.randomUUID();await vaultPut(id,{cipher:enc.cipher.buffer,iv:enc.iv,key:enc.key,hash:enc.hash});bar.style.width="90%";let d=loadDB(),u=user();d.files.push({id,name:f.name,encryptedName:id+".enc",mime:f.type||"application/octet-stream",originalSize:f.size,encryptedSize:enc.cipher.byteLength,senderId:u.id,recipientId:recipient,message:document.getElementById("message").value.trim(),createdAt:new Date().toISOString(),hash:enc.hash,status:"Delivered",transferStatus:"Delivered to recipient queue"});saveDB(d);bar.style.width="100%";window._selectedFile=null;toast("File encrypted and sent successfully.","success");setTimeout(()=>navigate("#/sent"),500)}catch(e){console.error(e);toast("Send failed. Your browser may block IndexedDB or storage access.","error");btn.disabled=false}}
function filesPage(kind){let d=loadDB(),u=user(),arr=d.files.filter(f=>kind==="received"?f.recipientId===u.id:f.senderId===u.id);let rows=arr.map(f=>{let other=d.users.find(x=>x.id===(kind==="received"?f.senderId:f.recipientId));return `<tr><td><b>${esc(f.name)}</b><br><small style="color:var(--muted)">${fmt(f.originalSize)}</small></td><td>${esc(other?.name||"Unknown")}</td><td>${date(f.createdAt)}</td><td><b>${esc(f.encryptedName||"encrypted-file.enc")}</b><br><small style="color:var(--muted)">${fmt(f.encryptedSize||0)}</small></td><td><span class="status secure">AES-256-GCM</span></td><td><span class="status secure">Delivered ✓</span></td><td><div class="actions"><button class="btn btn-secondary" onclick="viewFile('${f.id}')">View</button>${kind==="received"?`<button class="btn btn-primary" onclick="downloadFile('${f.id}')">Download</button>`:""}<button class="btn btn-danger" onclick="deleteFile('${f.id}')">Delete</button></div></td></tr>`}).join("");shell(kind,`<div class="page-title"><div><h1>${kind==="received"?"Received Files":"Sent Files"}</h1><p>${kind==="received"?"Files securely transferred to you.":"Files you have sent to other users."}</p></div>${kind==="sent"?`<button class="btn btn-primary" onclick="navigate('#/upload')">+ Send File</button>`:""}</div><div class="card"><div class="table-wrap">${rows?`<table class="table"><thead><tr><th>File</th><th>${kind==="received"?"Sender":"Recipient"}</th><th>Date</th><th>Encrypted Storage</th><th>Encryption</th><th>Status</th><th>Actions</th></tr></thead><tbody>${rows}</tbody></table>`:`<div style="text-align:center;padding:55px 15px;color:var(--muted);font-size:15px">📁<br><br>No ${kind} files yet.</div>`}</div></div>`)}
function viewFile(id){let d=loadDB(),f=d.files.find(x=>x.id===id),u=user();if(!f||!(f.senderId===u.id||f.recipientId===u.id)){toast("Unauthorized access.","error");return}let sender=d.users.find(x=>x.id===f.senderId),recipient=d.users.find(x=>x.id===f.recipientId);shell("",`<div class="page-title"><div><h1>File Details</h1><p>Security and transfer information.</p></div><button class="btn btn-secondary" onclick="history.back()">← Back</button></div><div class="card"><h2>🔒 File Security Information</h2><div class="detail-grid"><div class="detail"><small>File name</small><b>${esc(f.name)}</b></div><div class="detail"><small>Original size</small><b>${fmt(f.originalSize)}</b></div><div class="detail"><small>Encrypted storage</small><b>${esc(f.encryptedName||"encrypted-file.enc")}</b></div><div class="detail"><small>Encrypted size</small><b>${fmt(f.encryptedSize||0)}</b></div><div class="detail"><small>Sender</small><b>${esc(sender?.name||"Unknown")}</b></div><div class="detail"><small>Recipient</small><b>${esc(recipient?.name||"Unknown")}</b></div><div class="detail"><small>Encryption</small><b>AES-256-GCM ✓</b></div><div class="detail"><small>Key protection</small><b>Protected key material ✓</b></div><div class="detail"><small>Integrity</small><b>SHA-256 ✓</b></div><div class="detail"><small>Transfer</small><b>${esc(f.transferStatus||"Delivered ✓")}</b></div></div><div class="detail" style="margin-top:10px"><small>SHA-256 hash</small><div class="hash">${f.hash.map(x=>x.toString(16).padStart(2,"0")).join("")}</div></div><div class="detail" style="margin-top:10px"><small>Sender message</small><b>${esc(f.message||"No message added")}</b></div><div class="actions" style="margin-top:18px">${f.recipientId===u.id?`<button class="btn btn-primary" onclick="downloadFile('${f.id}')">Download & Verify</button>`:""}<button class="btn btn-danger" onclick="deleteFile('${f.id}')">Delete</button></div></div>`)}
async function downloadFile(id){let d=loadDB(),f=d.files.find(x=>x.id===id),u=user();if(!f||f.recipientId!==u.id){toast("You are not authorized to download this file.","error");return}toast("Decrypting and verifying integrity...");try{let vaultData=await vaultGet(id);if(vaultData){f={...f,...vaultData,cipher:base64(vaultData.cipher)}}let res=await decryptDemo(f);if(!res.verified){toast("Integrity check failed. Download rejected.","error");return}let blob=new Blob([res.plain],{type:f.mime}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);toast("File decrypted and SHA-256 verified.","success")}catch(e){console.error(e);toast("Decryption failed. The encrypted file may be unavailable.","error")}}
function deleteFile(id){let d=loadDB(),u=user(),f=d.files.find(x=>x.id===id);if(!f||!(f.senderId===u.id||f.recipientId===u.id)){toast("Unauthorized access.","error");return}if(!confirm("Delete this file transfer?"))return;d.files=d.files.filter(x=>x.id!==id);saveDB(d);vaultDelete(id);toast("File deleted.","success");navigate("#/"+(f.senderId===u.id?"sent":"received"))}
function security(){shell("security",`<div class="page-title"><div><h1>Security Center</h1><p>Security mechanisms used by this working UI.</p></div></div><div class="security-grid"><div class="security-card"><div class="big">🔒</div><h3>AES-256-GCM</h3><p>Each uploaded file gets a fresh random AES-256 key and IV through the Web Crypto API. Authenticated encryption detects tampering.</p><span class="status">Enabled</span></div><div class="security-card"><div class="big">🛡️</div><h3>SHA-256 Integrity</h3><p>A SHA-256 digest is calculated before encryption and checked after decryption. A mismatch prevents the download.</p><span class="status">Enabled</span></div><div class="security-card"><div class="big">👤</div><h3>Authentication</h3><p>Users must log in before accessing the application workspace. The current session controls protected pages.</p><span class="status">Enabled</span></div><div class="security-card"><div class="big">🔐</div><h3>Authorization</h3><p>File actions check whether the current user is the sender or intended recipient. Recipient download is restricted.</p><span class="status">Enabled</span></div></div><div class="card" style="margin-top:18px"><h2>Encryption Workflow</h2><div style="font-size:16px;line-height:2;color:var(--muted)">Original file → <b style="color:var(--text)">AES-256-GCM</b> → Encrypted data → Protected transfer record → Authorized recipient → Decryption → <b style="color:var(--text)">SHA-256 verification</b> → Original file</div></div>`)}
function profile(){let u=user();shell("profile",`<div class="page-title"><div><h1>Profile</h1><p>Manage your account information.</p></div></div><div class="card" style="max-width:750px"><div class="detail-grid"><div class="detail"><small>Full Name</small><b>${esc(u.name)}</b></div><div class="detail"><small>Email</small><b>${esc(u.email)}</b></div><div class="detail"><small>Account Created</small><b>${date(u.createdAt)}</b></div><div class="detail"><small>Authentication</small><b>Active ✓</b></div></div><div class="form-group"><label>Update name</label><input id="newname" class="input" value="${esc(u.name)}"></div><button class="btn btn-primary" onclick="updateName()">Save Profile</button><div class="detail" style="margin-top:18px"><small>Public Key Information</small><div class="hash">${esc(u.publicKey)}</div></div><p style="color:var(--muted);font-size:13px;margin-top:16px">Private cryptographic keys are never displayed in this interface.</p></div>`)}
function updateName(){let n=document.getElementById("newname").value.trim();if(!n){toast("Name cannot be empty.","error");return}let d=loadDB(),u=d.users.find(x=>x.id===session());u.name=n;saveDB(d);toast("Profile updated.","success");profile()}
function sendPage(){uploadPage()}
function router(){loadDB();applyTheme();let h=location.hash||"#/";if(h==="#"||h==="#/")return landing();if(h==="#/login")return auth("login");if(h==="#/register")return auth("register");if(!session()){return navigate("#/login")}let path=h.slice(2);if(path==="dashboard")dashboard();else if(path==="upload")uploadPage();else if(path==="send")sendPage();else if(path==="received")filesPage("received");else if(path==="sent")filesPage("sent");else if(path==="security")security();else if(path==="profile")profile();else if(path.startsWith("files/"))viewFile(path.split("/")[1]);else dashboard()}
window.addEventListener("hashchange",router);window.addEventListener("load",router);
</script>
</body>
</html>
